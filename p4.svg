<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Arial,sans-serif">
<rect width="800" height="420" fill="#0e1622"/>
<text x="24" y="40" fill="#f6b516" font-size="24" font-weight="bold">S/R FLIP — THE RETEST</text>
<line x1="60" y1="220" x2="740" y2="220" stroke="#f6b516" stroke-width="3"/>
<text x="60" y="205" fill="#f6b516" font-size="16">SUPPORT ... then RESISTANCE</text>
<polyline points="40,160 120,215 200,150 280,215 360,300 440,225 520,320 660,360" fill="none" stroke="#f2f5f9" stroke-width="5" stroke-linejoin="round"/>
<polygon points="440,250 428,225 452,225" fill="#ef5350"/>
<text x="460" y="272" fill="#ef5350" font-size="17" font-weight="bold">RETEST = rejection</text>
<text x="24" y="400" fill="#8b9bb4" font-size="15">Broken support often returns as resistance. The retest is your confirmation.</text>
</svg>