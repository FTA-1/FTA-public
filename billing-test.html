<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Billing diagnostics</title>
<style>body{background:#0d1424;color:#e8ecf5;font-family:sans-serif;padding:20px}button{padding:12px 20px;font-size:16px;border:0;border-radius:10px;background:#4a8cff;color:#fff;margin:4px 0}pre{background:#111a2e;padding:12px;border-radius:10px;white-space:pre-wrap}</style>
</head><body>
<h2>Billing diagnostics</h2>
<button onclick="run()">RUN CHECKS</button>
<button onclick="buy()">TEST PURCHASE pro_monthly</button>
<pre id="out">Tap RUN CHECKS, then TEST PURCHASE.</pre>
<script>
let svc=null;
function log(t){document.getElementById('out').textContent=t;}
async function run(){
  const o=[];
  o.push('getDigitalGoodsService: '+ typeof window.getDigitalGoodsService);
  try{
    svc = await window.getDigitalGoodsService('https://play.google.com/billing');
    o.push('service: '+ (svc?'OK':'NULL'));
    if(svc){
      const d = await svc.getDetails(['pro_monthly','ultimate_monthly','lifetime_pro']);
      o.push('products found: '+ (d&&d.length? d.map(x=>x.itemId).join(', ') : 'NONE'));
    }
  }catch(e){ o.push('ERROR: '+ (e&&e.message?e.message:e)); }
  log(o.join('\n'));
}
async function buy(){
  const o=[document.getElementById('out').textContent,''];
  try{
    o.push('calling PaymentRequest...');
    log(o.join('\n'));
    const request = new PaymentRequest([{
      supportedMethods: 'https://play.google.com/billing',
      data: { sku: 'pro_monthly' }
    }]);
    const response = await request.show();
    const token = response.details && response.details.purchaseToken;
    o.push('PURCHASE OK token: '+ (token? token.slice(0,16)+'...':'(none)'));
    if(response.complete){ await response.complete('success'); }
    if(svc && token){ try{ await svc.acknowledge(token); o.push('acknowledged'); }catch(e2){ o.push('ack error: '+e2.message); } }
  }catch(e){
    o.push('PURCHASE ERROR: '+ (e&&e.message? e.message : String(e)));
  }
  log(o.join('\n'));
}
</script>
</body></html>
