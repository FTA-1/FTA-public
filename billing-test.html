<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Billing diagnostics</title>
<style>body{background:#0d1424;color:#e8ecf5;font-family:sans-serif;padding:20px}button{padding:12px 20px;font-size:16px;border:0;border-radius:10px;background:#4a8cff;color:#fff}pre{background:#111a2e;padding:12px;border-radius:10px;white-space:pre-wrap}</style>
</head><body>
<h2>Billing diagnostics</h2>
<button onclick="run()">RUN CHECKS</button>
<pre id="out">Tap RUN CHECKS inside the installed app.</pre>
<script>
async function run(){
  const o=[];
  o.push('referrer: '+ (document.referrer||'(empty)'));
  o.push('getDigitalGoodsService: '+ typeof window.getDigitalGoodsService);
  try{
    if(!window.getDigitalGoodsService){
      o.push('RESULT: BILLING API MISSING -> app build lacks Play Billing feature, or not running inside the TWA');
    } else {
      const svc = await window.getDigitalGoodsService('https://play.google.com/billing');
      o.push('service: '+ (svc? 'OK':'NULL'));
      if(svc){
        const d = await svc.getDetails(['pro_monthly','ultimate_monthly','lifetime_pro']);
        o.push('products found: '+ (d&&d.length? d.map(x=>x.itemId).join(', ') : 'NONE (propagation or account issue)'));
      }
    }
  }catch(e){ o.push('ERROR: '+ (e&&e.message? e.message : e)); }
  document.getElementById('out').textContent = o.join('\n');
}
</script>
</body></html>
